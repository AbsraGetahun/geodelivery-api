services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: geodelivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: geodelivery
    ports:
      - "5433:5432"
    volumes:
      - geodelivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d geodelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: geodelivery-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - geodelivery_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geodelivery_pgdata:
  geodelivery_redisdata: